<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Extension Options</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="src/options/options.css">
</head>

<body>
    <div class="sticky-header">
        <div class="header-content">
            <div class="header-title">
                <h2>ELH Tim's helper - Options</h2>
                <p>All settings are stored locally. Don't forget to save.</p>
            </div>
            <div>
                <button id="save" class="primary">Save</button>
            </div>
        </div>
    </div>

    <div class="container">

        <div class="row">
            <div class="col card">
                <label class="label">Gemini API Key</label>
                <div class="key-row" style="display: flex; gap: 10px;">
                    <input class="secretinput" id="apiKey" type="password" placeholder="GEMINI_API_KEY">
                    <button id="clear">Clear</button>
                </div>
                <label class="label">Upload .env file
                    <input id="envFile" type="file" accept=".env">
                </label>
                <div id="status" class="status"></div>
            </div>
            <div class="col card">
                <button id="test" title="Send a test prompt using the saved key">Test Gemini</button>
                <div id="testResult" class="status" style="white-space:pre-wrap;margin-top:8px"></div>
            </div>
        </div>

        <div class="row">
            <div class="col card">
                <label class="label">JSON prompt for AI to make<br><b>Room Name</b></label>
                <div class="json-actions">
                    <div>
                        <button id="validate">Validate JSON</button>
                        <button id="pretty">Pretty Print</button>
                    </div>
                </div>
                <textarea id="promptObj" spellcheck="false"></textarea>
                <button id="defaults">Load Default</button>
                <div id="jsonStatus" class="status"></div>
            </div>
            <div class="col card">
                <label class="label">JSON prompt for AI to make<br><b>Room Description</b></label>
                <div class="json-actions">
                    <div>
                        <button id="validateDesc">Validate JSON</button>
                        <button id="prettyDesc">Pretty Print</button>
                    </div>
                </div>
                <textarea id="promptDescObj" spellcheck="false"></textarea>
                <button id="defaultsDesc">Load Default</button>
                <div id="jsonDescStatus" class="status"></div>
            </div>
            <div class="col card">
                <label class="label">JSON prompt for AI to make<br><b>Address</b></label>
                <div class="json-actions">
                    <div>
                        <button id="validateAddress">Validate JSON</button>
                        <button id="prettyAddress">Pretty Print</button>
                    </div>
                </div>
                <textarea id="promptAddressObj" spellcheck="false"></textarea>
                <button id="defaultsAddress">Load Default</button>
                <div id="jsonAddressStatus" class="status"></div>
            </div>
        </div>

        <div class="row">
            <div class="col card">
                <label class="label"><b>Randomized Room Names</b><br>one per line, use &lt;N&gt; for number</label>

                <textarea id="randomNamesObj" spellcheck="false" style="min-height: 150px;"></textarea>
                <div id="namesStatus" class="status"></div>
                <div class="json-actions">
                    <button id="defaultsNames">Restore Default Names</button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col card">
                <label class="label"><b>Open rooms tabs</b> settings</label>
                <div>
                    <input type="checkbox" id="openListingRoomsInBG">
                    <label for="openListingRoomsInBG">Stay in same page after opening all tabs</label>
                </div>
                <div>
                    <input type="checkbox" id="openInSameTabGroup">
                    <label for="openInSameTabGroup">Open all tabs in the same tab group</label>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col card">
                <label class="label"><b>Universal JSON pasting</b> settings</label>
                <div>
                    <input type="checkbox" id="deleteBlockedDatesBeforePasting">
                    <label for="deleteBlockedDatesBeforePasting">In Room Blocked Dates page, delete all blocked dates
                        before
                        pasting new ones</label>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col card">
                <label class="label"><b>Batch Processing</b></label>
                <div class="description" style="font-size: 0.9em; color: #666; margin-bottom: 8px;">
                    Paste your data here. Columns must be: <b>URL</b> [tab] <b>JSON</b>.
                </div>
                <textarea id="batchInput" spellcheck="false" placeholder="https://.../form/123	{...}"
                    style="min-height: 100px; white-space: pre; overflow-x: scroll;"></textarea>

                <div id="batchPreviewContainer" style="margin-top: 15px; overflow-x: auto;">
                    <!-- Table will be injected here -->
                    <p style="color: #888; font-style: italic;">Preview will appear here...</p>
                </div>

                <div
                    style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                    <div
                        style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                        <div id="batchControls" style="display: inline-flex; gap: 5px;">
                            <button id="batchProcessBtn" disabled>▶︎ Start Batch Process</button>
                        </div>
                        <div
                            style="font-size: 13px; color: #555; display: flex; align-items: center; gap: 5px; background: #f3f4f6; padding: 4px 10px; border-radius: 6px;">
                            <span>Auto-pause after</span>
                            <input type="number" id="autoPauseLimit" value="0" min="0"
                                style="width: 50px; padding: 4px; text-align: center; border: 1px solid #ddd; border-radius: 4px;">
                            <span>tabs (0 = off)</span>
                        </div>
                        <div
                            style="font-size: 13px; color: #555; display: flex; align-items: center; gap: 5px; background: #f3f4f6; padding: 4px 10px; border-radius: 6px;">
                            <input type="checkbox" id="batchProcessInBackground">
                            <label for="batchProcessInBackground" style="margin-bottom: 0;">Do Batch Process in
                                background</label>
                        </div>
                    </div>

                    <div id="statusContainer"
                        style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; font-size: 13px; min-height: 20px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <strong>Status:</strong>
                            <span id="batchStatus" class="status" style="margin: 0; font-weight: normal;">Ready</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="src/options/options.js"></script>
</body>

</html>
